name: update-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - 'master'
  pull_request:
    paths:
      - '.github/workflows/update-app.yml'
      - 'build.properties'

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: update-app # secrets are gated by this environment
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      -
        name: GitHub auth token from GitHub App
        id: write-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTAPPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PORTAPPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.write-app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update Signal
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &update-script |
            const fs = require('fs');
            const path = require('path');

            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: 'signalapp',
              repo: 'Signal-Desktop'
            });
            const match = /^v(\d+\.\d+\.\d+)$/.exec(release.tag_name);
            if (release.draft || release.prerelease || !match) {
              throw new Error(`Unexpected latest Signal release: ${release.tag_name}`);
            }

            const filename = path.join(process.env.GITHUB_WORKSPACE, 'build.properties');
            const content = fs.readFileSync(filename, 'utf8');

            function propertyValue(name) {
              const match = content.match(new RegExp(`^${name.replaceAll('.', '\\.')}\\s*=\\s*(.+)$`, 'm'));
              if (!match) {
                throw new Error(`Missing ${name} in build.properties`);
              }
              return match[1].trim();
            }

            const currentVersion = propertyValue('app.version');
            const currentRelease = Number(propertyValue('app.release'));
            const versionParts = version => {
              if (!/^\d+\.\d+\.\d+$/.test(version)) {
                throw new Error(`Invalid app.version: ${version}`);
              }
              return version.split('.').map(Number);
            };
            const current = versionParts(currentVersion);
            const latest = versionParts(match[1]);
            core.setOutput('title', `Signal ${match[1]}`);
            core.setOutput('version', match[1]);
            const comparison = latest.findIndex((part, i) => part !== current[i]);
            if (comparison < 0 || latest[comparison] < current[comparison]) {
              core.info(`Signal ${currentVersion} is already up to date`);
              return;
            }
            if (!Number.isSafeInteger(currentRelease) || currentRelease < 0) {
              throw new Error(`Invalid app.release: ${currentRelease}`);
            }

            const nextRelease = currentRelease + 1;
            const updated = content
              .replace(/^(app\.version\s*=\s*).+$/m, (_, prefix) => `${prefix}${match[1]}`)
              .replace(/^(app\.release\s*=\s*).+$/m, (_, prefix) => `${prefix}${nextRelease}`);
            fs.writeFileSync(filename, updated, 'utf8');
            core.info(`Updated Signal from ${currentVersion} to ${match[1]}`);
      -
        name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: update-signal
          token: ${{ steps.write-app.outputs.token }}
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          signoff: true
          sign-commits: true
          delete-branch: true
          body: |
            This updates Signal to ${{ steps.update.outputs.version }}.

  diff:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update Signal
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *update-script
      -
        name: Show diff
        shell: pwsh
        run: |
          $diff = git --no-pager diff -- build.properties
          if ($diff) {
            $diff
          } else {
            Write-Host "No update diff."
          }
